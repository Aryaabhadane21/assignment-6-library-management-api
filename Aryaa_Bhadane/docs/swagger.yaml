openapi: 3.0.0
info:
  title: Library Management REST API
  description: Full OpenAPI 3.0 specification for Library Management System REST API built with Node.js, Express, JWT, bcrypt, and Firebase Firestore.
  version: 1.0.0
  contact:
    name: Aryaa Bhadane
servers:
  - url: /
    description: Current Server

paths:
  /api/auth/register:
    post:
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: Jane Doe
                email:
                  type: string
                  format: email
                  example: jane.doe@example.com
                password:
                  type: string
                  format: password
                  example: secret123
                role:
                  type: string
                  enum: [student, librarian]
                  example: student
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Validation error
        '409':
          description: Email already in use

  /api/auth/login:
    post:
      summary: Login user and return JWT
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: jane.doe@example.com
                password:
                  type: string
                  format: password
                  example: secret123
      responses:
        '200':
          description: Successful authentication with JWT
        '401':
          description: Invalid email or password

  /api/auth/profile:
    get:
      summary: Get logged in user profile
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile details
        '401':
          description: Unauthorized
    put:
      summary: Update own profile
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Profile updated
        '401':
          description: Unauthorized
        '409':
          description: Email conflict

  /api/books:
    get:
      summary: List all books with optional filters
      tags:
        - Books
      parameters:
        - in: query
          name: category
          schema:
            type: string
          description: Filter by book category
        - in: query
          name: status
          schema:
            type: string
            enum: [available, borrowed]
          description: Filter by book availability status
        - in: query
          name: author
          schema:
            type: string
          description: Filter by author name
      responses:
        '200':
          description: List of books matching criteria
    post:
      summary: Add a new book (Librarian only)
      tags:
        - Books
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '201':
          description: Book added
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Librarian role required)

  /api/books/search:
    get:
      summary: Search books by title or author
      tags:
        - Books
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: Title or author search query string
      responses:
        '200':
          description: Search results
        '400':
          description: Search query parameter missing

  /api/books/{id}:
    get:
      summary: Get details for a single book
      tags:
        - Books
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Book ID
      responses:
        '200':
          description: Book details
        '404':
          description: Book not found
    put:
      summary: Update a book (Librarian only)
      tags:
        - Books
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '200':
          description: Book updated
        '403':
          description: Forbidden
        '404':
          description: Book not found
    delete:
      summary: Delete a book (Librarian only)
      tags:
        - Books
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Book deleted
        '403':
          description: Forbidden
        '404':
          description: Book not found

  /api/books/{id}/borrow:
    post:
      summary: Borrow a book (Student only)
      tags:
        - Borrow & Return
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Book borrowed successfully (due date set to 14 days)
        '400':
          description: Book unavailable or already borrowed by user
        '403':
          description: Forbidden (Student role required)
        '404':
          description: Book not found

  /api/books/{id}/return:
    post:
      summary: Return a borrowed book (Student only)
      tags:
        - Borrow & Return
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Book returned successfully
        '400':
          description: No active borrow transaction found for user and book
        '403':
          description: Forbidden (Student role required)
        '404':
          description: Book not found

  /api/transactions:
    get:
      summary: View all library transactions (Librarian only)
      tags:
        - Transactions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of all library transactions
        '403':
          description: Forbidden

  /api/transactions/my:
    get:
      summary: View logged in user's transaction history
      tags:
        - Transactions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of user transactions

  /api/users:
    get:
      summary: List all users (Librarian only)
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of registered users (passwords omitted)
        '403':
          description: Forbidden

  /api/users/{id}:
    get:
      summary: Get details of a specific user (Librarian only)
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User profile details
        '404':
          description: User not found
    delete:
      summary: Delete a user account (Librarian only)
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted
        '404':
          description: User not found

  /api/users/{id}/role:
    put:
      summary: Change a user's role (Librarian only)
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum: [student, librarian]
                  example: librarian
      responses:
        '200':
          description: User role updated
        '400':
          description: Invalid role specified
        '404':
          description: User not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT Bearer token

  schemas:
    BookInput:
      type: object
      required:
        - title
        - author
        - isbn
        - category
        - quantity
      properties:
        title:
          type: string
          example: The Great Gatsby
        author:
          type: string
          example: F. Scott Fitzgerald
        isbn:
          type: string
          example: 978-0743273565
        category:
          type: string
          example: Fiction
        quantity:
          type: integer
          minimum: 0
          example: 5
        status:
          type: string
          enum: [available, borrowed]
          example: available
